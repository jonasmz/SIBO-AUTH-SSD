# Acceptance-only override: publishes the backend ports that the Phase 1-7 procedures address directly.
# compose.yml itself never publishes them (production reaches the backends only through `frontend`).
# Appended to COMPOSE_FILE by tests/acceptance/deployment-env.sh; never used in production.
services:
  auth-api:
    ports:
      - "${AUTH_HTTP_PORT:-8080}:8080"
  api-a:
    ports:
      - "${API_A_HTTP_PORT:-8081}:8080"
  api-b:
    ports:
      - "${API_B_HTTP_PORT:-8082}:8080"
