# Production frontend / reverse proxy (Phase 8). The single external entry point: it serves the compiled Angular
# files supplied by the operator and is the only route to auth-api, api-a and api-b, which publish no port.
# Contract: specs/008-phase-8-operations-final-integration/contracts/deployment-topology.md
#
# Public Authentication API URLs use /auth and never expose the internal /api/auth or /api/admin prefixes:
#   /auth/admin/<resource>  -> auth-api /api/admin/<resource>
#   /auth/<operation>       -> auth-api /api/auth/<operation>
# Redundant or internal forms (/auth/api/auth/login, /auth/health/..., /auth/openapi/..., /auth/scalar) translate
# into /api/auth/... paths that have no route and answer 404, so health and documentation are never reachable.
#
# The proxy never replaces Identity lockout or the application's own request limits (Technical Constraints §37).

# First limiting layer, looser than the application's: one shared allowance per client address.
limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    root /usr/share/nginx/html;

    # Keep translated Location headers relative, as the application issues them, instead of rebuilding them from
    # this server's name and listen port (which differ from the browser-visible origin behind port mapping).
    absolute_redirect off;

    # Inherited by every proxied location: overwrite, never append, so a client cannot choose the address the
    # application rate-limits; auth-api trusts these headers only from this container's fixed address.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The refresh cookie is issued for the internal Path=/api/auth; the browser stores it for the public /auth.
    # Only the path changes: name, value, HttpOnly, Secure, SameSite and expiry are passed through untouched.
    proxy_cookie_path /api/auth /auth;

    location ^~ /auth/admin/ {
        proxy_pass     http://auth-api:8080/api/admin/;
        # Created users and roles report their location; it is translated to the public form.
        proxy_redirect /api/admin/ /auth/admin/;
    }

    # The four anonymous sensitive operations carry the first limiting layer.
    location ~ ^/auth/(login|refresh|forgot-password|reset-password)$ {
        limit_req        zone=auth_sensitive burst=20 nodelay;
        limit_req_status 429;
        rewrite          ^/auth/(.*)$ /api/auth/$1 break;
        proxy_pass       http://auth-api:8080;
    }

    # A plain prefix (not ^~), so the limited operations above are matched by their regular expression first.
    location /auth/ {
        proxy_pass http://auth-api:8080/api/auth/;
    }

    location = /auth {
        return 404;
    }

    location ^~ /api-a/api/ {
        proxy_pass http://api-a:8080/api/;
    }

    location ^~ /api-b/api/ {
        proxy_pass http://api-b:8080/api/;
    }

    # Consumer health and anything else under the Business API prefixes is never routed (the exact forms
    # without a trailing slash would otherwise be redirected to the proxied prefix).
    location = /api-a/api {
        return 404;
    }

    location = /api-b/api {
        return 404;
    }

    # Consumer health and anything else under the Business API prefixes is never routed.
    location ^~ /api-a/ {
        return 404;
    }

    location ^~ /api-b/ {
        return 404;
    }

    # Application files with single-page-application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
