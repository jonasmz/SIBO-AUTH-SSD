# Reference first layer in front of Authentication API (Phase 7). This is an operator artifact, not part of
# compose.yml: the complete production proxy (frontend files, TLS, routing) is delivered by Phase 8.
#
# What the application relies on (specs/007-phase-7-security-hardening/contracts/configuration-and-proxy.md):
#   1. X-Forwarded-For is OVERWRITTEN with the address the proxy saw ($remote_addr), never appended to a
#      client-supplied value, so a client cannot choose the address the application rate-limits.
#   2. X-Forwarded-Proto carries the scheme the client used; Host is forwarded.
#   3. A first limiting layer, looser than the application's own limits, protects the sensitive endpoints.
#   4. Request bodies are size-limited.
#   5. The proxy is the only route to auth-api; its address (or network) is the only value configured in
#      ReverseProxy__TrustedProxies / ReverseProxy__TrustedNetworks.
# The proxy layer never replaces Identity account lockout or the application's request limits.

# One shared allowance per client address across the four sensitive paths: 60 requests/minute.
limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 16k;

    # Inherited by every location below: overwrite, never append.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # First limiting layer: login, refresh, forgot-password, reset-password. Its 429 is Nginx's own (HTML),
    # distinguishable from the application's problem+json 429.
    location ~ ^/api/auth/(login|refresh|forgot-password|reset-password)$ {
        limit_req        zone=auth_sensitive burst=20 nodelay;
        limit_req_status 429;
        proxy_pass       http://auth-api:8080;
    }

    location /api/auth/ {
        proxy_pass http://auth-api:8080;
    }

    location /health/ {
        proxy_pass http://auth-api:8080;
    }
}
