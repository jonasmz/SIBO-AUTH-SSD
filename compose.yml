# Production topology (Phase 8): exactly four services. `frontend` is the single external entry point (static
# files + reverse proxy, HTTPS terminated there); auth-api, api-a and api-b publish no port and are reachable only
# through it on the internal network. Persistent data lives on host bind mounts, outside the Compose lifecycle.
# Operations guide: docs/phase-8-operations.md. Contract:
# specs/008-phase-8-operations-final-integration/contracts/deployment-topology.md
services:
  frontend:
    # Official image pinned by the digest validated in Phase 7 (nginx 1.30.5).
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    depends_on:
      - auth-api
      - api-a
      - api-b
    ports:
      - "${FRONTEND_HTTPS_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./deploy/frontend/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      # Cloudflare edge ranges whose CF-Connecting-IP is trusted (refresh with update-cloudflare-ips.sh).
      - type: bind
        source: ./deploy/frontend/cloudflare-realip.conf
        target: /etc/nginx/cloudflare-realip.conf
        read_only: true
      # The compiled Angular application, supplied by the project owner (not built here).
      - type: bind
        source: ${FRONTEND_STATIC_HOST_PATH:?set FRONTEND_STATIC_HOST_PATH}
        target: /usr/share/nginx/html
        read_only: true
      # tls.crt and tls.key for the external origin.
      - type: bind
        source: ${FRONTEND_TLS_HOST_PATH:?set FRONTEND_TLS_HOST_PATH}
        target: /etc/nginx/tls
        read_only: true
    networks:
      default:
        # Fixed, so auth-api can trust forwarded headers from this address only.
        ipv4_address: ${FRONTEND_INTERNAL_ADDRESS:-172.30.80.10}

  auth-api:
    build:
      context: .
      dockerfile: src/Authentication.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Persistence__ConnectionString: "Data Source=/var/lib/auth-api/data/auth.db"
      Jwt__Issuer: "${AUTH_JWT_ISSUER:?set AUTH_JWT_ISSUER}"
      Jwt__Audience: "${AUTH_JWT_AUDIENCE:?set AUTH_JWT_AUDIENCE}"
      Jwt__AccessTokenLifetimeMinutes: "${AUTH_JWT_LIFETIME_MINUTES:-15}"
      Jwt__PrivateKeyPath: "/var/lib/auth-api/keys/jwt-private.pem"
      Jwt__ClockSkewSeconds: "${AUTH_JWT_CLOCK_SKEW_SECONDS:-30}"
      RefreshSession__LifetimeDays: "${AUTH_REFRESH_SESSION_LIFETIME_DAYS:-7}"
      Security__FrontendOrigin: "${AUTH_FRONTEND_ORIGIN:?set AUTH_FRONTEND_ORIGIN}"
      DataProtection__KeysPath: "/var/lib/auth-api/dataprotection"
      Logging__File__Directory: "/app/logs"
      Logging__File__RetentionDays: "${AUTH_LOG_RETENTION_DAYS:-30}"
      Smtp__Host: "${AUTH_SMTP_HOST:?set AUTH_SMTP_HOST}"
      Smtp__Port: "${AUTH_SMTP_PORT:?set AUTH_SMTP_PORT}"
      Smtp__Security: "${AUTH_SMTP_SECURITY:?set AUTH_SMTP_SECURITY}"
      Smtp__Username: "${AUTH_SMTP_USERNAME:-}"
      Smtp__Password: "${AUTH_SMTP_PASSWORD:-}"
      Smtp__SenderAddress: "${AUTH_SMTP_SENDER_ADDRESS:?set AUTH_SMTP_SENDER_ADDRESS}"
      Smtp__SenderName: "${AUTH_SMTP_SENDER_NAME:?set AUTH_SMTP_SENDER_NAME}"
      # Phase 7 hardening: every value is optional. The lockout defaults are repeated here because the
      # Identity binder rejects an empty TimeSpan; blank request-limit and proxy values keep their defaults.
      Identity__Lockout__MaxFailedAccessAttempts: "${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:-5}"
      Identity__Lockout__DefaultLockoutTimeSpan: "${AUTH_LOCKOUT_DURATION:-00:15:00}"
      # AUTH_RATE_LIMIT_ENABLED=false switches the application's request limits off (tests/staging only).
      RateLimiting__Enabled: "${AUTH_RATE_LIMIT_ENABLED:-}"
      RateLimiting__Login__PermitLimit: "${AUTH_RATE_LIMIT_LOGIN_PERMIT_LIMIT:-}"
      RateLimiting__Login__WindowSeconds: "${AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-}"
      RateLimiting__Refresh__PermitLimit: "${AUTH_RATE_LIMIT_REFRESH_PERMIT_LIMIT:-}"
      RateLimiting__Refresh__WindowSeconds: "${AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS:-}"
      RateLimiting__ForgotPassword__PermitLimit: "${AUTH_RATE_LIMIT_FORGOT_PASSWORD_PERMIT_LIMIT:-}"
      RateLimiting__ForgotPassword__WindowSeconds: "${AUTH_RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:-}"
      RateLimiting__ResetPassword__PermitLimit: "${AUTH_RATE_LIMIT_RESET_PASSWORD_PERMIT_LIMIT:-}"
      RateLimiting__ResetPassword__WindowSeconds: "${AUTH_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:-}"
      RateLimiting__ForgotPasswordAddress__PermitLimit: "${AUTH_RATE_LIMIT_FORGOT_PASSWORD_ADDRESS_PERMIT_LIMIT:-}"
      RateLimiting__ForgotPasswordAddress__WindowSeconds: "${AUTH_RATE_LIMIT_FORGOT_PASSWORD_ADDRESS_WINDOW_SECONDS:-}"
      # Only the frontend's fixed address may supply X-Forwarded-For / X-Forwarded-Proto.
      ReverseProxy__TrustedProxies: "${AUTH_TRUSTED_PROXIES:-${FRONTEND_INTERNAL_ADDRESS:-172.30.80.10}}"
      ReverseProxy__TrustedNetworks: "${AUTH_TRUSTED_NETWORKS:-}"
    volumes:
      - type: bind
        source: ${AUTH_SQLITE_HOST_PATH:?set AUTH_SQLITE_HOST_PATH}
        target: /var/lib/auth-api/data
      # The private signing key is mounted only into auth-api, read-only.
      - type: bind
        source: ${AUTH_RSA_HOST_PATH:?set AUTH_RSA_HOST_PATH}
        target: /var/lib/auth-api/keys
        read_only: true
      # Data Protection key ring: a host bind mount (never a Compose-managed volume), so
      # restart, recreation and `docker compose down -v` keep outstanding reset tokens valid.
      - type: bind
        source: ${AUTH_DATAPROTECTION_HOST_PATH:?set AUTH_DATAPROTECTION_HOST_PATH}
        target: /var/lib/auth-api/dataprotection
      # Persistent daily log files (UTC), kept outside the Compose lifecycle.
      - type: bind
        source: ${AUTH_LOGS_HOST_PATH:?set AUTH_LOGS_HOST_PATH}
        target: /app/logs

  api-a:
    image: reference-consumer-api:dev
    build:
      context: .
      dockerfile: src/ReferenceConsumer.Api/Dockerfile
    environment: &consumer-environment
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: "${AUTH_JWT_ISSUER:?set AUTH_JWT_ISSUER}"
      Jwt__Audience: "${AUTH_JWT_AUDIENCE:?set AUTH_JWT_AUDIENCE}"
      Jwt__ClockSkewSeconds: "${AUTH_JWT_CLOCK_SKEW_SECONDS:-30}"
      Jwt__PublicKeyPath: "/var/lib/consumer/jwt-public.pem"
      Service__Name: api-a
    volumes: &consumer-volumes
      # Only the public key file is mounted; consumers never see the private key or SQLite.
      - type: bind
        source: ${AUTH_JWT_PUBLIC_KEY_HOST_FILE:-./keys/jwt-public.pem}
        target: /var/lib/consumer/jwt-public.pem
        read_only: true

  api-b:
    image: reference-consumer-api:dev
    build:
      context: .
      dockerfile: src/ReferenceConsumer.Api/Dockerfile
    environment:
      <<: *consumer-environment
      Service__Name: api-b
    volumes: *consumer-volumes

networks:
  default:
    ipam:
      config:
        - subnet: ${AUTH_INTERNAL_SUBNET:-172.30.80.0/24}
