openapi: 3.1.0
info:
  title: Authentication API - Phase 5 Password Change Contract
  version: 5.0.0
  description: >-
    Authenticated self-service password change. Adds one operation; every Phase 1-4 operation is
    unchanged. Passwords, hashes and security stamps never appear in any response.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/auth/change-password:
    post:
      summary: Replace the caller's own password and end the caller's other renewable sessions
      description: >-
        Acts only on the account identified by the access token `sub` claim; the body carries no
        account identifier. On success the password is replaced through Identity and, in the same
        transaction, every active renewable-session family of the user is revoked except the one
        identified by a usable `auth_refresh` cookie belonging to the same user. Without such a
        cookie all families are revoked. The cookie never authenticates or authorizes the request
        and is not modified. Access tokens already issued remain valid until expiry. Any failure
        changes neither the password nor any session.
      operationId: changePassword
      security:
        - bearerAuth: []
      parameters:
        - in: cookie
          name: auth_refresh
          required: false
          description: Optional. Selects the renewable session to keep; confers no authority.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password replaced; other sessions revoked. No body and no Set-Cookie.
        '400':
          description: >-
            Invalid request (not JSON, malformed, missing or blank field) or a new password that
            violates the configured Identity policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidRequest:
                  value: { status: 400, title: Bad Request, detail: The request is invalid. }
                passwordPolicy:
                  value: { status: 400, title: Bad Request, detail: The password does not satisfy the password policy. }
        '401':
          description: >-
            Either the access token is missing/invalid/expired (response carries
            `WWW-Authenticate: Bearer`, detail "Authentication is required.") or the current password
            is incorrect (no `WWW-Authenticate`, detail "Invalid credentials.").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                authenticationRequired:
                  value: { status: 401, title: Unauthorized, detail: Authentication is required. }
                invalidCurrentPassword:
                  value: { status: 401, title: Unauthorized, detail: Invalid credentials. }
        '503':
          description: Persistence unavailable or not ready; nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example: { status: 503, title: Service Unavailable, detail: The service is not ready. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          writeOnly: true
          description: Must satisfy the externally configured Identity password policy.
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
