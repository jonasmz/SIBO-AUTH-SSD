openapi: 3.1.0
info:
  title: Authentication API - Phase 6 Password Recovery Contract
  version: 6.0.0
  description: >-
    Anonymous password recovery and reset. Adds two operations; every Phase 1-5 operation is
    unchanged. Reset tokens, passwords, hashes, security stamps and SMTP settings never appear in
    any response.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/auth/forgot-password:
    post:
      summary: Request password-reset instructions by email
      description: >-
        Anonymous. For an existing, enabled account a temporary Identity reset token is generated and
        sent by email. For an unknown or disabled account nothing is generated or sent. The response
        is the same in every well-formed case, including an email delivery failure, so account
        existence is not revealed. Response timing is not claimed to be equivalent.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Request accepted. No body, no cookie.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/reset-password:
    post:
      summary: Replace a password with an emailed reset token
      description: >-
        Anonymous; no access token or session is required or consulted. On success the password is
        replaced through Identity and, in the same transaction, every active renewable-session family
        of the user is revoked; no session is kept. The token becomes unusable. Access tokens already
        issued remain valid until expiry. Any failure changes neither the password nor any session.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password replaced; all renewable sessions revoked. No body, no cookie.
        '400':
          description: >-
            Invalid request (not JSON, malformed, missing or blank field, invalid email format), or a
            valid token with a new password that violates the configured Identity policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidRequest:
                  value: { status: 400, title: Bad Request, detail: The request is invalid. }
                passwordPolicy:
                  value: { status: 400, title: Bad Request, detail: The password does not satisfy the password policy. }
        '401':
          description: >-
            Invalid, altered, other-account, expired or already-used token, unknown email or
            disabled account. Identical in every case; no WWW-Authenticate header.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example: { status: 401, title: Unauthorized, detail: Invalid or expired reset token. }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    InvalidRequest:
      description: Not JSON, malformed, missing or blank field, or invalid email format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example: { status: 400, title: Bad Request, detail: The request is invalid. }
    ServiceUnavailable:
      description: Persistence unavailable or not ready; nothing changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example: { status: 503, title: Service Unavailable, detail: The service is not ready. }
  schemas:
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: The value received by email, exactly as sent (base64url).
        newPassword:
          type: string
          minLength: 1
          writeOnly: true
          description: Must satisfy the externally configured Identity password policy.
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
